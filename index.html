<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAURO — Liga Académica Urológica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde: #2b6803;
      --verde-mid: #3d8f04;
      --verde-light: #5cb806;
      --verde-dark: #1a4002;
      --verde-darker: #0d2001;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--verde-darker);
      overflow-x: hidden;
    }

    /* FUNDO COM GRADIENTE ANIMADO */
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(61,143,4,.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(43,104,3,.4) 0%, transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #0d2001 0%, #050e00 100%);
      animation: bgShift 12s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0%   { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    /* PARTÍCULAS DECORATIVAS */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(92,184,6,.12);
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: .4; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* CONTEÚDO */
    .page {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    /* BADGE TOPO */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(92,184,6,.12);
      border: 1px solid rgba(92,184,6,.25);
      border-radius: 100px;
      padding: 6px 18px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.6);
      letter-spacing: .8px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #5cb806;
      box-shadow: 0 0 8px #5cb806;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.8); }
    }

    /* LOGO */
    .logo-wrap {
      margin-bottom: 32px;
      position: relative;
    }
    .logo-ring {
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 1px solid rgba(92,184,6,.2);
      animation: spin 20s linear infinite;
    }
    .logo-ring::before {
      content: '';
      position: absolute;
      top: -3px; left: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #5cb806;
      transform: translateX(-50%);
      box-shadow: 0 0 10px #5cb806;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-img {
      width: 100px; height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(92,184,6,.3);
      box-shadow: 0 0 40px rgba(43,104,3,.5), 0 0 80px rgba(43,104,3,.2);
      position: relative;
    }

    /* TÍTULO */
    .titulo {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(36px, 8vw, 72px);
      color: #fff;
      line-height: 1.05;
      margin-bottom: 8px;
      text-shadow: 0 2px 40px rgba(43,104,3,.5);
    }
    .titulo em {
      font-style: italic;
      color: #a8e063;
    }
    .subtitulo-nome {
      font-size: clamp(13px, 3vw, 16px);
      font-weight: 400;
      color: rgba(255,255,255,.45);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .descricao {
      font-size: clamp(14px, 2.5vw, 17px);
      color: rgba(255,255,255,.55);
      font-weight: 300;
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto 48px;
    }

    /* DIVISOR */
    .divisor {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(92,184,6,.5), transparent);
      margin: 0 auto 48px;
    }

    /* BOTÕES DE CONTATO */
    .contatos {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 64px;
    }
    .btn-contato {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all .25s cubic-bezier(.34,1.56,.64,1);
      cursor: pointer;
      border: none;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-contato:hover {
      transform: translateY(-3px) scale(1.04);
    }
    .btn-email {
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.85);
      border: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(10px);
    }
    .btn-email:hover {
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.25);
    }
    .btn-whatsapp {
      background: #25d366;
      color: #fff;
      box-shadow: 0 4px 24px rgba(37,211,102,.35);
    }
    .btn-whatsapp:hover {
      background: #20ba59;
      box-shadow: 0 8px 32px rgba(37,211,102,.45);
    }
    .btn-sistema {
      background: linear-gradient(135deg, var(--verde), var(--verde-mid));
      color: #fff;
      box-shadow: 0 4px 24px rgba(43,104,3,.4);
    }
    .btn-sistema:hover {
      box-shadow: 0 8px 32px rgba(43,104,3,.55);
    }

    /* ÍCONES SVG */
    .icon { width: 18px; height: 18px; flex-shrink: 0; }

    /* RODAPÉ */
    .rodape {
      color: rgba(255,255,255,.2);
      font-size: 12px;
      letter-spacing: .5px;
    }
    .rodape strong { color: rgba(255,255,255,.35); font-weight: 500; }

    /* LINHA DECORATIVA */
    .linha-deco {
      width: 100%;
      max-width: 400px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(92,184,6,.2), transparent);
      margin: 0 auto 32px;
    }

    @media(max-width: 480px) {
      .contatos { flex-direction: column; align-items: center; }
      .btn-contato { width: 100%; max-width: 280px; justify-content: center; }
    }
  </style>
</head>
<body>

<div class="bg"></div>

  <!-- BOTÕES -->

  </div>

  <div class="linha-deco"></div>

  <!-- RODAPÉ -->
  <p class="rodape">
    © 2025 <strong>LAURO — Liga Académica Urológica</strong><br>
    lauroucpcde.com

</div>

<script>
  // Gerar partículas
  const container = document.getElementById('particles');
  const count = 18;
  for(let i=0; i<count; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random()*6+3;
    p.style.cssText = `
      width:${size}px;height:${size}px;
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*15+10}s;
      animation-delay:${Math.random()*10}s;
      opacity:${Math.random()*.4+.1};
    `;
    container.appendChild(p);
  }
</script>

</body>
</html>
